<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso de Datos de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Ingreso de Datos de Clientes</h1>

    <form id="formCliente" novalidate>

      <div class="campo">
        <label for="cedula">Cédula:</label>
        <input type="text" id="cedula" maxlength="10" placeholder="10 dígitos">
        <span class="error" id="errorCedula"></span>
      </div>

      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" maxlength="30" placeholder="Nombre completo">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="campo">
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" maxlength="50" placeholder="Dirección">
        <span class="error" id="errorDireccion"></span>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono Celular:</label>
        <input type="text" id="telefono" maxlength="10" placeholder="10 dígitos">
        <span class="error" id="errorTelefono"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo Electrónico:</label>
        <input type="text" id="correo" placeholder="ejemplo@correo.com">
        <span class="error" id="errorCorreo"></span>
      </div>

      <button type="submit">Guardar Cliente</button>

      <p class="mensaje-exito" id="mensajeExito"></p>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
