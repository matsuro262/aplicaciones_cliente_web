<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Automatizada</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">
        <h1>Calculadora</h1>
        <form id="formcalculadora" novalidate>
            <div class="campo">
                <label for="numero1">Número 1:</label>
                <input type="number" id="numero1" placeholder="n1">
            </div>

            <div class="campo">
                <label for="numero2">Número 2:</label>
                <input type="number" id="numero2" placeholder="n2">
            </div>

            <!-- Botón único para disparar el cálculo masivo -->
            <button type="button" id="calcularTodo">Calcular Todo</button>

            <hr>

            <!-- Los 5 campos de texto independientes para los resultados -->
            <div class="campo">
                <label for="res_suma">Suma:</label>
                <input type="text" id="res_suma" placeholder="Resultado Suma" readonly>
            </div>

            <div class="campo">
                <label for="res_resta">Resta:</label>
                <input type="text" id="res_resta" placeholder="Resultado Resta" readonly>
            </div>

            <div class="campo">
                <label for="res_multiplicar">Multiplicación:</label>
                <input type="text" id="res_multiplicar" placeholder="Resultado Multiplicación" readonly>
            </div>

            <div class="campo">
                <label for="res_dividir">División:</label>
                <input type="text" id="res_dividir" placeholder="Resultado División" readonly>
            </div>

            <div class="campo">
                <label for="res_modulo">Módulo:</label>
                <input type="text" id="res_modulo" placeholder="Resultado Módulo" readonly>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
